<!DOCTYPE html>
<html lang="en">
<head><script src="../deadnet-host.js"></script>
	<meta charset="UTF-8">
	<title>Hocus :focus — Level 6</title>
	<meta name="description" content="A keyboard navigation horror game. Find the 🎃 pumpkin.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link rel="stylesheet" type="text/css" href="../assets/css/hocus.css">
	<meta property="og:title" content="Hocus :focus">
	<meta property="og:description" content="A keyboard navigation horror game. Find the 🎃 pumpkin.">
	<meta property="og:image" content="https://focus.hteumeuleu.com/assets/images/og.png">
</head>
<body>
	<div class="page">
		<header class="header" role="banner">
			<h1 class="title"><a href="../index.html">HOCUS :FOCUS</a></h1>
			<p class="subtitle">
				A keyboard accessibility horror&nbsp;game.
			</p>
		</header>
		<main class="main" role="main">
			<div class="rules">
	<p>Hurray! Now get your <span class="char" style="color:#ecdb8b;"><span aria-hidden="true">🧹</span> broom</span> to clean this <code>order</code> mess.</p>
</div>
<form action="../7/index.html">
	<div class="game has-focus-styles">
		<div class="scoreboard">
			<span class="level">Level 6</span>
			<span class="timer">00:00.00</span>
		</div>
		<button type="button" class="icon is-start" autofocus="autofocus"><span role="img" aria-label="woman mage">🧙‍♀️</span> <span class="badge">Start</span></button>
		<button type="button" class="icon"><span role="img" aria-label="crystal ball">🔮</span></button>
		<button type="button" class="icon"><span role="img" aria-label="snake">🐍</span></button>
		<button type="button" class="icon"><span role="img" aria-label="owl">🦉</span></button>
		<button type="button" class="icon"><span role="img" aria-label="wilted flower">🥀</span></button>
		<button type="button" class="icon"><span role="img" aria-label="candle">🕯️</span></button>
		<button type="button" class="icon"><span role="img" aria-label="spider">🕷️</span></button>
		<button type="button" class="icon"><span role="img" aria-label="bat">🦇</span></button>
		<button type="button" class="icon"><span role="img" aria-label="chestnut">🌰</span></button>
		<button type="button" class="icon"><span role="img" aria-label="spider web">🕸️</span></button>
		<button type="button" class="icon"><span role="img" aria-label="skull">💀</span></button>
		<button type="button" class="icon"><span role="img" aria-label="fallen leaf">🍂</span></button>
		<button type="button" class="icon"><span role="img" aria-label="coffin">⚰️</span></button>
		<button type="submit" class="icon is-finish"><span role="img" aria-label="broom">🧹</span> <span class="badge">Finish</span></button>
	</div>
</form>
<style>
	.icon:nth-of-type(1) { order:1; }
	.icon:nth-of-type(2) { order:9; }
	.icon:nth-of-type(3) { order:6; }
	.icon:nth-of-type(4) { order:12; }
	.icon:nth-of-type(5) { order:8; }
	.icon:nth-of-type(6) { order:14; }
	.icon:nth-of-type(7) { order:4; }
	.icon:nth-of-type(8) { order:7; }
	.icon:nth-of-type(9) { order:13; }
	.icon:nth-of-type(10) { order:10; }
	.icon:nth-of-type(11) { order:5; }
	.icon:nth-of-type(12) { order:3; }
	.icon:nth-of-type(13) { order:11; }
	.icon:nth-of-type(14) { order:2; }
</style>
<div class="instructions">
	<p class="is-key-next">
		<kbd>TAB</kbd> Next
	</p>
	<p class="is-key-previous">
		<kbd>SHIFT</kbd> + <kbd>TAB</kbd> Previous
	</p>
	<p class="is-key-validate">
		<kbd>ENTER</kbd> Validate
	</p>
</div>

		</main>
		<footer class="footer" role="contentinfo">
			<p>A monstrosity  made by <a href="https://mastodon.social/@HTeuMeuLeu">@HTeuMeuLeu</a>.</p>
			<p><a href="https://github.com/hteumeuleu/hocus-focus">View code on GitHub</a></p>
		</footer>
	</div>
	
	<script src="../assets/js/hocus.js" defer></script>
	<noscript><style>.timer{display:none;}</style></noscript>
	
</body>
</html>
