<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy Bird</title>
    <meta name="description" content="A canvas-based Flappy Bird clone. Tap or press Space / Arrow Up to flap — dodge the pipes and chase your best score.">
    <meta name="theme-color" content="#0c1915">
    <meta property="og:title" content="Flappy Bird">
    <meta property="og:description" content="A canvas-based Flappy Bird clone. Tap or press Space / Arrow Up to flap — dodge the pipes and chase your best score.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="favicon/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg-deep:#0a1412;
        --bg-pine:#0c1915;
        --accent:#f8c948;
        --danger:#ff5f52;
        --ink:#e8efe9;
        --muted:#93a89d;
      }
      *{ margin:0; box-sizing:border-box; }
      body{
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:26px;
        padding:32px 16px;
        background:
          radial-gradient(120% 90% at 50% -10%, rgba(64,143,105,0.26), transparent 60%),
          radial-gradient(90% 70% at 50% 115%, rgba(28,78,118,0.20), transparent 60%),
          linear-gradient(180deg, var(--bg-pine), var(--bg-deep));
        color:var(--ink);
        font-family:ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        -webkit-user-select:none;
        user-select:none;
        -webkit-tap-highlight-color:transparent;
        touch-action:manipulation;
      }
      header{ text-align:center; }
      h1{
        font-family:"Press Start 2P", monospace;
        font-size:clamp(22px, 5vw, 34px);
        letter-spacing:0.04em;
        color:var(--accent);
        text-shadow:0 3px 0 rgba(0,0,0,0.45);
      }
      .subtitle{
        margin-top:12px;
        font-size:13px;
        letter-spacing:0.02em;
        color:var(--muted);
      }
      .game-wrap{
        position:relative;
        width:100%;
        max-width:288px;
      }
      canvas{
        display:block;
        width:100%;
        height:auto;
        border-radius:18px;
        border:2px solid rgba(255,255,255,0.09);
        box-shadow:
          0 24px 70px rgba(0,0,0,0.55),
          0 0 46px rgba(64,143,105,0.22),
          0 0 0 6px rgba(248,201,72,0.06);
      }
      .settings-btn{
        position:absolute;
        top:10px;
        right:10px;
        z-index:5;
        width:38px;
        height:38px;
        display:flex;
        align-items:center;
        justify-content:center;
        border:2px solid rgba(255,255,255,0.18);
        border-radius:50%;
        background:rgba(8,14,12,0.55);
        color:var(--ink);
        cursor:pointer;
        transition:transform 250ms ease, background 200ms ease, border-color 200ms ease;
      }
      .settings-btn:hover,
      .settings-btn:focus-visible{
        background:rgba(8,14,12,0.85);
        border-color:var(--accent);
        transform:rotate(60deg);
      }
      .settings-panel{
        position:absolute;
        inset:0;
        z-index:6;
        display:none;
        align-items:center;
        justify-content:center;
      }
      .settings-panel.open{ display:flex; }
      .settings-card{
        width:224px;
        padding:16px 20px 18px;
        background:rgba(22,30,28,0.97);
        border:3px solid rgba(248,201,72,0.85);
        border-radius:16px;
        box-shadow:0 18px 50px rgba(0,0,0,0.5);
      }
      .settings-head{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:14px;
      }
      .settings-title{
        font-family:"Press Start 2P", monospace;
        font-size:11px;
        color:var(--accent);
        letter-spacing:0.04em;
      }
      .settings-close{
        width:26px;
        height:26px;
        display:flex;
        align-items:center;
        justify-content:center;
        border:none;
        border-radius:50%;
        background:rgba(255,255,255,0.08);
        color:var(--muted);
        font-size:12px;
        cursor:pointer;
        transition:color 150ms ease, background 150ms ease;
      }
      .settings-close:hover{
        color:var(--ink);
        background:rgba(255,255,255,0.16);
      }
      .setting-row{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:9px 0;
      }
      .setting-row + .setting-row{
        border-top:1px solid rgba(255,255,255,0.08);
      }
      .setting-label{
        display:block;
        font-family:"Press Start 2P", monospace;
        font-size:9px;
        color:var(--ink);
      }
      .setting-sub{
        display:block;
        margin-top:5px;
        font-size:10px;
        color:var(--muted);
      }
      .switch{
        position:relative;
      }
      .switch input{
        position:absolute;
        opacity:0;
        width:1px;
        height:1px;
      }
      .switch-track{
        display:block;
        width:42px;
        height:24px;
        border-radius:12px;
        background:rgba(255,255,255,0.14);
        position:relative;
        cursor:pointer;
        transition:background 200ms ease;
      }
      .switch-knob{
        position:absolute;
        top:3px;
        left:3px;
        width:18px;
        height:18px;
        border-radius:50%;
        background:var(--ink);
        transition:transform 200ms ease;
      }
      .switch input:checked + .switch-track{
        background:var(--accent);
      }
      .switch input:checked + .switch-track .switch-knob{
        transform:translateX(18px);
        background:#1a241f;
      }
      .switch input:focus-visible + .switch-track{
        outline:2px solid var(--accent);
        outline-offset:2px;
      }
      footer{
        font-size:12px;
        color:var(--muted);
        text-align:center;
        max-width:60ch;
      }
      footer a{
        color:var(--accent);
        text-decoration-thickness:2px;
        transition:color 200ms ease;
      }
      footer a:hover{
        color:var(--ink);
      }
      @media (min-width: 880px) and (min-height: 520px){
        body{
          height:100dvh;
          overflow:hidden;
          flex-direction:row;
          gap:clamp(20px, 4vw, 72px);
          padding:32px 48px;
        }
        header{
          text-align:left;
          max-width:280px;
        }
        h1{
          font-size:clamp(18px, 2.2vw, 24px);
        }
        .game-wrap{
          width:auto;
          height:min(512px, calc(100dvh - 64px));
          aspect-ratio:288/512;
        }
        canvas{
          width:100%;
          height:100%;
        }
        footer{
          text-align:right;
          max-width:280px;
        }
      }
      @media (prefers-reduced-motion: no-preference){
        h1{ animation:bob 4s ease-in-out infinite; }
      }
      @keyframes bob{
        50%{ transform:translateY(-4px); }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Flappy Bird</h1>
      <p class="subtitle">Tap, or press Space / ↑ to flap · don't hit the pipes</p>
    </header>
    <main>
      <div class="game-wrap">
        <canvas id="canvas" width="288" height="512" role="img" aria-label="Flappy Bird game — tap or press Space or Arrow Up to flap; after game over, tap or press Space again to restart"></canvas>
        <button id="settingsBtn" class="settings-btn" type="button" aria-label="Open settings" aria-expanded="false" aria-haspopup="dialog" aria-controls="settingsPanel">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Settings" aria-modal="true" aria-hidden="true">
          <div class="settings-card">
            <div class="settings-head">
              <span class="settings-title">SETTINGS</span>
              <button id="settingsClose" class="settings-close" type="button" aria-label="Close settings">✕</button>
            </div>
            <div class="setting-row">
              <div class="setting-text">
                <span class="setting-label">MUSIC</span>
                <span class="setting-sub">background music</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="musicToggle" aria-label="Toggle background music">
                <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
              </label>
            </div>
            <div class="setting-row">
              <div class="setting-text">
                <span class="setting-label">SFX</span>
                <span class="setting-sub">sound effects</span>
              </div>
              <label class="switch">
                <input type="checkbox" id="sfxToggle" aria-label="Toggle sound effects">
                <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      A canvas remake of the classic — <a href="https://github.com/pyforgedev/flappy-bird" target="_blank" rel="noopener">source on GitHub</a>
    </footer>
    <script src="flappyBird.js"></script>
  </body>
</html>
